## ═══════════════════════════════════════════════════════════════
## openvibe.compare — reference vhost for ov-vhost-install.
##
## Compare now runs in OpenVibe.Compare on port 5280. Kept here so an Exchange deployment
## cannot restore the retired shared-process target. Canonical vhost: OpenVibe.Compare/deploy/nginx/.
## ═══════════════════════════════════════════════════════════════

limit_req_zone $binary_remote_addr zone=compare_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=compare_api:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=compare_forms:10m rate=1r/s;

server {
    listen 80;
    listen [::]:80;
    server_name openvibe.compare www.openvibe.compare;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://openvibe.compare$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.openvibe.compare;

    ssl_certificate     /etc/letsencrypt/live/openvibe.compare/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.compare/privkey.pem;

    return 301 https://openvibe.compare$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openvibe.compare;
    include snippets/security-txt.conf;

    ssl_certificate     /etc/letsencrypt/live/openvibe.compare/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.compare/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/openvibe.compare.access.log;
    error_log  /var/log/nginx/openvibe.compare.error.log;

    # The remark API's JSON body cap is 32 KB; leave room for headers.
    client_max_body_size 64k;

    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json application/problem+json image/svg+xml text/plain application/xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /auth/me {
        limit_req zone=compare_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5280;
    }

    location /auth/ {
        limit_req zone=compare_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5280;
    }

    location /api/ {
        limit_req zone=compare_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5280;
    }

    # A reader's remark is the only form on the site.
    location = /remarks {
        limit_req zone=compare_forms burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5280;
    }

    # Host-local scrapers only; OpenVibe.Events' account delivery is loopback-only.
    location ~* ^/metrics(/|$) { return 404; }
    location ~* ^/internal(/|$) { return 404; }

    location / {
        proxy_pass http://127.0.0.1:5280;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
